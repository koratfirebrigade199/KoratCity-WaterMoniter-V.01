name: Auto Fetch Water Data

on:
  schedule:
    - cron: '0 * * * *' # รันทุกๆ 1 ชั่วโมง
  workflow_dispatch: # กดสั่งรันเองใน GitHub Actions ได้

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch Latest Data
        run: python scripts/fetch_data.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_data.json
          git diff-index --quiet HEAD || git commit -m "Auto update water data from ThaiWater"
          git push
